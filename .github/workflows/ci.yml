# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native core, scripts and licence register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake
      - name: Configure, build and test (host)
        run: |
          cmake --preset host
          cmake --build --preset host
          ctest --preset host
      - name: Configure, build and test (ASan and UBSan)
        run: |
          cmake --preset host-sanitize
          cmake --build --preset host-sanitize
          ctest --preset host-sanitize

  jvm:
    name: Pure Kotlin modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test pure Kotlin modules (Android modules excluded)
        run: ./gradlew -Pechocatch.android=false :core:model:test :core:policy:test

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "sdkmanager not found; relying on the Android Gradle plugin to download SDK packages"
          fi
      - name: Build and lint the debug apps
        run: ./gradlew :app:assembleDebug :app:lintDebug :spikes:assembleDebug :spikes:lintDebug
      - name: Permission guard on the built APKs (ADR-0007)
        run: |
          python3 -I tools/ci/check_permissions.py --profile app --apk app/build/outputs/apk/debug/app-debug.apk
          python3 -I tools/ci/check_permissions.py --profile spikes --apk spikes/build/outputs/apk/debug/spikes-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: echocatch-lab-apk
          path: spikes/build/outputs/apk/debug/spikes-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            spikes/build/reports/lint-results-debug.html
          if-no-files-found: ignore
