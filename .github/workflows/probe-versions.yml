# SPDX-License-Identifier: GPL-3.0-only
# Temporary: prints androidx stable versions and their compileSdk requirements because the
# development sandbox cannot reach Google Maven. Deleted in the next commit.
name: probe-versions

on:
  push:
    paths:
      - ".github/workflows/probe-versions.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Stable versions and AAR requirements
        shell: bash
        run: |
          python3 - <<'PY'
          import io, re, urllib.request, zipfile

          BASE = "https://dl.google.com/dl/android/maven2"

          def get(path):
              with urllib.request.urlopen(f"{BASE}/{path}", timeout=60) as r:
                  return r.read()

          def versions(group, artifact):
              text = get(f"{group}/{artifact}/maven-metadata.xml").decode()
              return re.findall(r"<version>(.*?)</version>", text)

          def stable(vs):
              return [v for v in vs if re.fullmatch(r"\d+\.\d+\.\d+", v)]

          def aar_meta(group, artifact, version):
              for name in (artifact, artifact + "-android"):
                  try:
                      data = get(f"{group}/{artifact if name == artifact else name}/{version}/{name}-{version}.aar")
                  except Exception:
                      continue
                  z = zipfile.ZipFile(io.BytesIO(data))
                  props = z.read("META-INF/com/android/build/gradle/aar-metadata.properties").decode()
                  keep = ("minCompileSdk=", "minAndroidGradlePluginVersion=")
                  return f"{name}: " + " ".join(l for l in props.splitlines() if l.startswith(keep))
              return "no aar found"

          print("== artifacts")
          for group, artifact in [
              ("androidx/activity", "activity-compose"),
              ("androidx/lifecycle", "lifecycle-runtime-compose"),
              ("androidx/lifecycle", "lifecycle-service"),
              ("androidx/lifecycle", "lifecycle-viewmodel-compose"),
              ("androidx/datastore", "datastore-preferences"),
              ("androidx/core", "core-ktx"),
              ("androidx/test/ext", "junit"),
              ("androidx/test", "runner"),
              ("androidx/test", "rules"),
          ]:
              st = stable(versions(group, artifact))
              latest = st[-1] if st else None
              print(f"{group}/{artifact}: last stable {st[-4:]}")
              if latest:
                  print("   ", latest, aar_meta(group, artifact, latest))

          print("== BOM history")
          boms = versions("androidx/compose", "compose-bom")[-7:]
          seen = {}
          for bom in boms:
              pom = get(f"androidx/compose/compose-bom/{bom}/compose-bom-{bom}.pom").decode()
              found = dict(
                  (a, v) for a, v in re.findall(
                      r"<groupId>androidx\.compose[^<]*</groupId>\s*<artifactId>([^<]+)</artifactId>\s*<version>([^<]+)</version>", pom)
                  if a in ("ui", "material3"))
              print(bom, found)
              seen[found.get("ui")] = bom
          for ui in seen:
              print("ui", ui, aar_meta("androidx/compose/ui", "ui", ui))
          PY
