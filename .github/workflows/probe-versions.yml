# SPDX-License-Identifier: GPL-3.0-only
# Temporary: prints androidx stable versions and their compileSdk requirements because the
# development sandbox cannot reach Google Maven. Deleted in the next commit.
name: probe-versions

on:
  push:
    paths:
      - ".github/workflows/probe-versions.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Stable versions and AAR requirements
        shell: bash
        run: |
          python3 - <<'PY'
          import io, re, urllib.request, zipfile

          BASE = "https://dl.google.com/dl/android/maven2"

          def get(path):
              with urllib.request.urlopen(f"{BASE}/{path}", timeout=60) as r:
                  return r.read()

          def versions(group, artifact):
              text = get(f"{group}/{artifact}/maven-metadata.xml").decode()
              return re.findall(r"<version>(.*?)</version>", text)

          def stable(vs):
              return [v for v in vs if re.fullmatch(r"\d+\.\d+\.\d+", v)]

          def aar_meta(group, artifact, version):
              for name in (artifact, artifact + "-android"):
                  try:
                      data = get(f"{group}/{artifact if name == artifact else name}/{version}/{name}-{version}.aar")
                  except Exception:
                      continue
                  z = zipfile.ZipFile(io.BytesIO(data))
                  try:
                      props = z.read("META-INF/com/android/build/gradle/aar-metadata.properties").decode()
                  except KeyError:
                      continue
                  keep = ("minCompileSdk=", "minAndroidGradlePluginVersion=")
                  return f"{name}: " + " ".join(l for l in props.splitlines() if l.startswith(keep))
              return "no aar metadata found"

          print("== specific versions")
          for group, artifact, version in [
              ("androidx/lifecycle", "lifecycle-runtime-compose", "2.10.0"),
              ("androidx/lifecycle", "lifecycle-runtime-compose", "2.9.4"),
              ("androidx/lifecycle", "lifecycle-runtime", "2.10.0"),
              ("androidx/core", "core-ktx", "1.18.0"),
              ("androidx/core", "core-ktx", "1.17.0"),
              ("androidx/core", "core", "1.18.0"),
              ("androidx/core", "core", "1.17.0"),
              ("androidx/activity", "activity-compose", "1.13.0"),
              ("androidx/activity", "activity", "1.13.0"),
              ("androidx/compose/ui", "ui", "1.11.4"),
              ("androidx/compose/material3", "material3", "1.4.0"),
              ("androidx/datastore", "datastore-preferences", "1.2.1"),
              ("androidx/datastore", "datastore-core", "1.2.1"),
          ]:
              print(f"{artifact} {version}:", aar_meta(group, artifact, version))
          PY
