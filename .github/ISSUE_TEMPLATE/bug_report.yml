name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone, Android version, earbuds
      placeholder: "OnePlus 11R, Android 14, OnePlus Buds 4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EchoCatch version
  - type: textarea
    id: logs
    attributes:
      label: Logs or exported report (please remove personal information; no audio)
      render: text
